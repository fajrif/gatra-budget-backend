info:
  contact:
    email: support@boilerplates.dev
    name: API Support
  description: REST API for the Boilerplates Go + React starter kit
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Boilerplates Backend API
  version: "1.0"
paths:
  /api/areas:
    get:
      consumes:
      - application/json
      description: Retrieve all areas with optional city_id filter, search, and pagination
      parameters:
      - description: Filter by city ID (UUID)
        in: query
        name: city_id
        type: string
      - description: Search by name
        in: query
        name: search
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 20)'
        in: query
        name: limit
        type: integer
      - description: Get all records without pagination
        in: query
        name: all
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: List of areas with pagination
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get all areas
      tags:
      - Areas
    post:
      parameters:
      - description: Area details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Area'
      responses:
        "201":
          description: Created area
          schema:
            $ref: '#/definitions/models.Area'
        "400":
          description: Invalid request body
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a new area
      tags:
      - Areas
  /api/areas/{id}:
